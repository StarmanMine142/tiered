plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${minecraft_version}-${mod_version}-fabric"
group = mod_group

base {
	archivesName = mod_id
}

def resourceTargets = [
		java_version: java_version,
		minecraft_version: minecraft_version,
		min_loader_version: min_loader_version,
		mod_page: mod_page,
		mod_version: mod_version,
		mod_issue_tracker: mod_issue_tracker,
		mod_name: mod_name,
		mod_license: mod_license,
		mod_id: mod_id,
		mod_authors: mod_authors,
		mod_description: mod_description,
]

repositories {
	mavenLocal()
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://repo.spongepowered.org/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
	modImplementation "maven.modrinth:modmenu:11.0.4"
}

loom {
	mixin.defaultRefmapName.set("${mod_id}.refmap.json")
	accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
	runs {
		client { runDir "run/client" }
		server { runDir "run/server" }
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(java_version)
	targetCompatibility = JavaVersion.toVersion(java_version)
}

processResources {
	inputs.properties(resourceTargets)
	filesMatching(["fabric.mod.json"]) {
		expand resourceTargets
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${mod_name}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = java_version.toInteger()
	options.compilerArgs += ['-parameters']
}
